<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TIPxSPLIT - Tip Calculator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">🪙 TIPxSPLIT</div>

    <!-- TOGGLE SWITCH -->
    <label class="toggle-switch" aria-label="Toggle dark/light mode">
      <input type="checkbox" id="themeToggle" />
      <span class="toggle-track">
        <span class="toggle-thumb">
          <span class="toggle-icon" id="themeIcon">🌙</span>
        </span>
      </span>
    </label>
  </header>

  <!-- MAIN CARD -->
  <main class="card">

    <!-- Bill Amount -->
    <div class="field-group">
      <label for="billInput">🏷️ Bill Amount</label>
      <div class="input-wrapper">
        <select id="currencySelect" aria-label="Select currency">
          <option value="Rs">🇵🇰 Rs</option>
          <option value="$">🇺🇸 $</option>
          <option value="€">🇪🇺 €</option>
          <option value="£">🇬🇧 £</option>
          <option value="¥">🇯🇵 ¥</option>
          <option value="AED">🇦🇪 AED</option>
          <option value="SAR">🇸🇦 SAR</option>
        </select>
        <input type="number" id="billInput" placeholder="0.00" min="0" step="0.01" />
      </div>
      <span class="error" id="billError"></span>
    </div>

    <!-- Tip % -->
    <div class="field-group">
      <label>🎯 Tip Percentage <span id="tipEmoji"></span></label>
      <div class="tip-presets">
        <button class="tip-btn" data-tip="10">10%</button>
        <button class="tip-btn" data-tip="15">15%</button>
        <button class="tip-btn active" data-tip="20">20%</button>
        <input type="number" id="customTip" placeholder="Custom %" min="0" max="100" />
      </div>
      <span class="error" id="tipError"></span>
    </div>

    <!-- Number of People -->
    <div class="field-group">
      <label for="peopleInput">👥 Split Between</label>
      <div class="input-wrapper">
        <span class="prefix">👤</span>
        <input type="number" id="peopleInput" placeholder="1" min="1" step="1" />
      </div>
      <span class="error" id="peopleError"></span>
    </div>

    <!-- RESULTS -->
    <div class="results-card" id="resultsCard">
      <div class="results-heading">🧮 Breakdown</div>
      <div class="result-row">
        <span class="result-label">💸 Tip Amount</span>
        <span class="result-value" id="tipAmount">Rs 0.00</span>
      </div>
      <div class="result-row">
        <span class="result-label">💰 Grand Total</span>
        <span class="result-value" id="grandTotal">Rs 0.00</span>
      </div>
      <div class="result-row highlight">
        <span class="result-label">🙋 Each Person Pays</span>
        <div class="per-person-group">
          <span class="result-value big" id="perPerson">Rs 0.00</span>
          <button class="copy-btn" id="copyBtn" aria-label="Copy per person amount" title="Copy">
            📋
          </button>
        </div>
      </div>
      <div class="split-summary" id="splitSummary"></div>
    </div>

    <!-- RESET -->
    <button class="reset-btn" id="resetBtn">❌ Reset All</button>

  </main>

  <footer class="footer">Made for Dev Weekends Fellowship 2026</footer>

  <script src="script.js"></script>
</body>
</html>
